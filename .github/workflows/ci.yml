name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/swe-agent

jobs:

  # ── Lint + Type Check ───────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install ruff mypy

      - name: Ruff lint
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

      - name: Mypy type check
        run: mypy src/ --ignore-missing-imports


  # ── Unit Tests ──────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: swe_agent_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        env:
          ANTHROPIC_API_KEY: sk-ant-fake-for-tests
          GITHUB_TOKEN: ghp_fake_for_tests
          GITHUB_WEBHOOK_SECRET: test-secret
          DATABASE_URL: postgresql+asyncpg://test_user:test_pass@localhost:5432/swe_agent_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest tests/unit/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80 \
            -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: coverage.xml


  # ── Build & Push Docker Image ───────────────────────────────────────────────
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDTIME=${{ github.event.repository.updated_at }}
            VERSION=${{ github.sha }}

      - name: Build and push Sandbox image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: sandbox
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-sandbox:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ── Deploy to Staging ───────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.swe-agent.yourdomain.com

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_HOST }}
          DEPLOY_KEY: ${{ secrets.STAGING_SSH_KEY }}
          IMAGE_TAG: develop-${{ github.sha }}
        run: |
          echo "$DEPLOY_KEY" | ssh-add -
          ssh -o StrictHostKeyChecking=no deploy@$DEPLOY_HOST <<EOF
            cd /srv/swe-agent
            export IMAGE_TAG=$IMAGE_TAG
            docker compose pull api worker
            docker compose up -d --no-deps api worker
            docker compose exec -T api python -c "from src.db.database import init_db; import asyncio; asyncio.run(init_db())"
          EOF


  # ── Deploy to Production ────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://swe-agent.yourdomain.com

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        env:
          DEPLOY_HOST: ${{ secrets.PROD_HOST }}
          DEPLOY_KEY: ${{ secrets.PROD_SSH_KEY }}
          IMAGE_TAG: main-${{ github.sha }}
        run: |
          echo "$DEPLOY_KEY" | ssh-add -
          ssh -o StrictHostKeyChecking=no deploy@$DEPLOY_HOST <<EOF
            cd /srv/swe-agent
            export IMAGE_TAG=$IMAGE_TAG
            # Rolling restart — no downtime
            docker compose pull api worker
            docker compose up -d --no-deps --scale worker=3 api worker
          EOF


  # ── Eval CI (runs weekly on cron + on main merges) ──────────────────────────
  evals:
    name: Golden Set Evals
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/develop'
    # Only run if secrets are available (skip on PRs from forks)
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run golden set evals (dry-run in CI)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_AGENT_TOKEN }}
        run: |
          python tests/evals/eval_runner.py --dry-run

      - name: Upload eval results
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.sha }}
          path: eval-results.json
