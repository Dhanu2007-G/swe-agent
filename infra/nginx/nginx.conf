# infra/nginx/nginx.conf — Production reverse proxy configuration.
#
# Responsibilities:
#   - TLS termination (Let's Encrypt / managed cert)
#   - Rate limiting at the network layer (before FastAPI)
#   - Security headers (CSP, HSTS, etc.)
#   - Connection pooling to FastAPI upstreams
#   - Static health check without hitting FastAPI
#   - Block common attack patterns

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ─────────────────────────────────────────────────────────────
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"body_bytes":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_time":"$upstream_response_time",'
            '"request_id":"$http_x_request_id",'
            '"user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    # ── Performance ──────────────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 75s;
    keepalive_requests 1000;
    client_max_body_size 5m;  # GitHub webhooks ~50KB; allow some margin
    server_tokens off;        # Don't reveal nginx version

    # ── Timeouts ────────────────────────────────────────────────────────────
    client_header_timeout 10s;
    client_body_timeout 60s;
    send_timeout 60s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;  # Agent runs can take up to 5 min

    # ── Gzip ────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain application/json application/javascript text/css;

    # ── Rate Limiting ────────────────────────────────────────────────────────
    # Zone 1: Webhook endpoint — 10 req/s per IP (burst of 20)
    limit_req_zone $binary_remote_addr zone=webhook:10m rate=10r/s;

    # Zone 2: API endpoints — 30 req/s per IP
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # Zone 3: Global — 100 req/s per IP (catches everything else)
    limit_req_zone $binary_remote_addr zone=global:20m rate=100r/s;

    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # Return 429 (Too Many Requests) instead of 503 on rate limit
    limit_req_status 429;
    limit_conn_status 429;

    # ── Upstream Pool ────────────────────────────────────────────────────────
    upstream swe_agent_api {
        server api:8000;
        keepalive 32;
        keepalive_requests 1000;
        keepalive_timeout 75s;
    }

    # ── Common Proxy Headers ─────────────────────────────────────────────────
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # ── Redirect HTTP → HTTPS ────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS Server ─────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name swe-agent.yourdomain.com;

        # TLS Configuration
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:MozSSL:10m;
        ssl_session_tickets off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        # HSTS — tell browsers to use HTTPS for 2 years
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Security headers (belt and suspenders — FastAPI also sets these)
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Block common attack patterns
        location ~* \.(php|asp|aspx|jsp|cgi)$ {
            return 404;
        }

        # Block access to hidden files (except .well-known)
        location ~ /\.(?!well-known) {
            deny all;
        }

        # ── GitHub Webhook Endpoint ──────────────────────────────────────────
        location /webhooks/ {
            limit_req zone=webhook burst=20 nodelay;
            limit_conn addr 10;

            proxy_pass http://swe_agent_api;

            # Webhooks must have these headers — block anything without them
            if ($http_x_hub_signature_256 = "") {
                return 401;
            }
        }

        # ── REST API ─────────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            limit_conn addr 20;

            proxy_pass http://swe_agent_api;
        }

        # ── Health Check — served by nginx directly (no FastAPI round-trip) ──
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # ── Prometheus Metrics — restrict to internal network ────────────────
        location /metrics {
            # Only allow internal monitoring network
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;

            proxy_pass http://swe_agent_api;
        }

        # ── Everything else ───────────────────────────────────────────────────
        location / {
            limit_req zone=global burst=100 nodelay;
            proxy_pass http://swe_agent_api;
        }

        # ── Rate limit error page ─────────────────────────────────────────────
        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            return 429 '{"detail":"rate_limit_exceeded","message":"Too many requests. Please retry after a moment."}';
        }
    }
}
