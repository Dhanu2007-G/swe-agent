apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: swe-agent-api-hpa
  namespace: swe-agent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: swe-agent-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: swe-agent-worker-hpa
  namespace: swe-agent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: swe-agent-worker
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
