apiVersion: apps/v1
kind: Deployment
metadata:
  name: swe-agent-api
  namespace: swe-agent
  labels:
    app: swe-agent-api
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: swe-agent-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: swe-agent-api
        component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: api
          image: ghcr.io/swe-agent/swe-agent:latest
          command:
            - uvicorn
            - src.api.main:app
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --workers
            - "2"
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: swe-agent-config
            - secretRef:
                name: swe-agent-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: swe-agent-api
  namespace: swe-agent
  labels:
    app: swe-agent-api
spec:
  type: ClusterIP
  selector:
    app: swe-agent-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
