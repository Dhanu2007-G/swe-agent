apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: swe-agent-api-pdb
  namespace: swe-agent
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: swe-agent-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: swe-agent-worker-pdb
  namespace: swe-agent
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: swe-agent-worker
