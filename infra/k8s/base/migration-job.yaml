apiVersion: batch/v1
kind: Job
metadata:
  name: swe-agent-migration
  namespace: swe-agent
  labels:
    app.kubernetes.io/name: swe-agent
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: swe-agent
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: migrate
          image: ghcr.io/swe-agent/swe-agent:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: swe-agent-config
            - secretRef:
                name: swe-agent-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
